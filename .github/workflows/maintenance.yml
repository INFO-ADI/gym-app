# Runs every hour (and on demand), for EVERY gym in gyms/:
#  1. Asks the gym's database whether setup is finished. This call also keeps each free
#     Supabase project awake (free projects pause after a week without activity).
#  2. When a gym has just been set up, sets "setupDone": true in its gym.json (which removes
#     its setup page), commits, and starts the deploy workflow. Pushes made with GITHUB_TOKEN
#     don't start other workflows by themselves, so it is started with `gh workflow run`.
#  3. Once a month makes a tiny commit so GitHub keeps this scheduled job switched on.
name: maintenance
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: maintenance
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check every gym (also keeps each database awake)
        id: check
        run: |
          changed=0
          for f in gyms/*/gym.json; do
            slug=$(jq -r '.slug' "$f")
            url=$(jq -r '.supabaseUrl' "$f")
            key=$(jq -r '.supabaseKey' "$f")
            done_flag=$(jq -r '.setupDone' "$f")
            if ! [[ "$url" =~ ^https://[a-z0-9]{20}\.supabase\.co$ ]] || ! [[ "$key" =~ ^sb_publishable_[A-Za-z0-9_-]+$ ]]; then
              echo "$slug: not connected to a database yet, skipped"
              continue
            fi
            res=$(curl -s -m 30 -X POST "$url/rest/v1/rpc/gym_installed" -H "apikey: $key" -H "Content-Type: application/json" -d '{}' || true)
            echo "$slug: database said: $res"
            if [ "$res" = "true" ] && [ "$done_flag" = "false" ]; then
              tmp=$(mktemp)
              jq '.setupDone = true' "$f" > "$tmp" && mv "$tmp" "$f"
              echo "$slug: setup finished, setup page will be removed"
              changed=1
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Commit finished setups and redeploy
        if: steps.check.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "gym-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gyms/*/gym.json
          git commit -q -m "Setup finished: hide setup page"
          git push -q
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
      - name: Monthly heartbeat so GitHub keeps this job on
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          if [ $(( (NOW - LAST) / 86400 )) -ge 45 ]; then
            git config user.name "gym-maintenance-bot"
            git config user.email "actions@users.noreply.github.com"
            date -u +%Y-%m-%dT%H:%MZ > .github/heartbeat
            git add .github/heartbeat
            git commit -q -m "heartbeat"
            git push -q
          fi
