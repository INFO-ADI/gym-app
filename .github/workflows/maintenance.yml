# Free Supabase projects pause after a week with no traffic. This pings the database once a day.
name: Keep database awake
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" web/inc/config.php)
          KEY=$(grep -oP "SUPABASE_KEY = '\K[^']+" web/inc/config.php)
          curl -fsS -X POST "$URL/rest/v1/rpc/site_api" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{"p_action":"site"}'
