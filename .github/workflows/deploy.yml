# Uploads the website (web/) to Hostinger by FTP on every push to main.
# Add these in GitHub → Settings → Secrets and variables → Actions:
#   FTP_SERVER    e.g. ftp.kanpurgym.com  (Hostinger → Files → FTP Accounts)
#   FTP_USERNAME  e.g. u123456789
#   FTP_PASSWORD  the FTP password
# Until the secrets exist the job just skips the upload.
name: Deploy website
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version (cache busting)
        run: sed -i "s/const VERSION      = 'dev'/const VERSION      = '${GITHUB_SHA::10}'/" web/inc/config.php && grep VERSION web/inc/config.php
      - name: Check PHP syntax
        run: for f in web/index.php web/inc/*.php; do php -l "$f"; done
      - name: Upload to Hostinger
        env:
          HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./web/
          server-dir: ./public_html/
          dangerous-clean-slate: false
