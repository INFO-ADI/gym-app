# Uploads the website (web/) to Hostinger by FTP on every push to main.
# Add these in GitHub → Settings → Secrets and variables → Actions:
#   FTP_SERVER    e.g. ftp.kanpurgym.com  (Hostinger → Files → FTP Accounts)
#   FTP_USERNAME  e.g. u123456789
#   FTP_PASSWORD  the FTP password
# Until the secrets exist the job just skips the upload.
name: Deploy website
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stamp version (cache busting)
        run: sed -i "s/const VERSION      = 'dev'/const VERSION      = '${GITHUB_SHA::10}'/" web/inc/config.php && grep VERSION web/inc/config.php
      - name: Check PHP syntax
        run: for f in web/index.php web/inc/*.php; do php -l "$f"; done
      - name: Upload to Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ]; then echo 'No FTP secrets yet, skipping upload'; exit 0; fi
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp >/dev/null
          SETTINGS="set ftp:ssl-allow no; set ftp:passive-mode on; set net:max-retries 5; set net:reconnect-interval-base 5; set net:timeout 30"
          # the FTP login opens in the domain folder; the website lives in its public_html folder
          TARGET=public_html
          echo "Uploading to $TARGET"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "$SETTINGS; mirror --reverse --parallel=3 --verbose=1 web/ $TARGET; bye" "$FTP_SERVER"
